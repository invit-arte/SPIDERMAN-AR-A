<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Marvel Experience AR</title>
<link rel="stylesheet" href="style.css">
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .mensaje {
      position: fixed;
      top: 20px;
      left: 50%;
      z-index: 999;
      width: calc(100% - 40px);
      max-width: 400px;
      box-sizing: border-box;
      padding: 12px 18px;
      transform: translateX(-50%);
      color: white;
      text-align: center;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="
      imageTargetSrc: assets/targets.mind;
      autoStart: true;
      filterMinCF: 0.001;
      filterBeta: 10;
    "
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <!-- Los recursos deben estar aquí -->
    <a-assets>
      <video
        id="videoAR"
        src="assets/VIDEO.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >
      <a-video
        src="#videoAR"
        position="0 0 0.01"
        width="1"
        height="0.5625"
      ></a-video>
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const scene = document.querySelector("a-scene");
      const target = document.querySelector("#target");
      const video = document.querySelector("#videoAR");
      const mensaje = document.querySelector("#mensaje");

      scene.addEventListener("arReady", () => {
        mensaje.textContent =
          "Apunta la cámara hacia la tarjeta de Alejandro";
      });

      scene.addEventListener("arError", () => {
        mensaje.textContent =
          "No se pudo abrir la cámara. Revisa los permisos.";
      });

      target.addEventListener("targetFound", () => {
        mensaje.style.display = "none";

        video.play().catch((error) => {
          console.log("No se pudo reproducir el video:", error);
        });
      });

      target.addEventListener("targetLost", () => {
        mensaje.style.display = "block";
        mensaje.textContent =
          "Apunta la cámara hacia la tarjeta de Alejandro";

        video.pause();
      });
    });
  </script>
<script src="script.js"></script>
</body>
</html>
